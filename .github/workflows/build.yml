name: 설치 파일 만들기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 테스트
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: 서명 비밀번호 확인
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::SIGNING_PASSWORD 비밀값이 없어요. 저장소 Settings > Secrets and variables > Actions 에 추가하세요."
            exit 1
          fi

      - name: 설치 파일(APK) 만들기
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: 이름 정리
        run: cp app/build/outputs/apk/release/app-release.apk hanjul-planner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hanjul-planner-apk
          path: hanjul-planner.apk

      - name: 릴리스에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 한줄일정 1.0.${{ github.run_number }}
          body: 휴대폰에서 아래 hanjul-planner.apk 를 눌러 내려받은 뒤 설치하세요.
          files: hanjul-planner.apk
